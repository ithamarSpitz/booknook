project_id = "torimitor"

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local `npm run web:serve` origin. Production Site URL is set in the cloud dashboard.
site_url = "http://127.0.0.1:4175"
additional_redirect_urls = ["https://ithamarspitz.github.io/torimitor-app/**"]
enable_signup = false

[auth.email]
# Public sign-up stays off via [auth] above; this keeps the email+password provider on, as in production.
enable_signup = true

# Production uses the same subject and file, pasted into Authentication > Emails > Invite user.
[auth.email.template.invite]
subject = "{{ .Data.inviter_name }} מזמין/ה אותך לתורימיטור"
content_path = "./supabase/templates/invite.html"

[functions.link-edition]
verify_jwt = true

[functions.invite-user]
verify_jwt = true

[functions.add-book]
verify_jwt = true

[functions.book-details]
verify_jwt = true

[functions.recommendations]
verify_jwt = true
